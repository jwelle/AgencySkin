<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgencySkin</title>
    <link rel="icon" href="assets/icons/cleanview-mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="brand-lockup">
        <img class="brand-mark" src="assets/icons/cleanview-mark.svg" alt="CleanView">
        <div>
          <p class="eyebrow">AgencySkin</p>
          <h1>CleanView</h1>
        </div>
      </header>

      <label class="toggle-row">
        <span>CleanView</span>
        <input id="enabledToggle" type="checkbox">
      </label>

      <label id="presetField" class="field" for="presetSelect">
        Active Profile
        <select id="presetSelect"></select>
      </label>

      <p id="emptyStateMessage" class="empty-state" hidden>No active view yet. Open the panel to create your first CleanView.</p>

      <section class="popup-section" aria-label="Manage">
        <p class="section-label">Manage</p>
        <div class="button-row">
          <button id="panelButton" type="button">Customize CleanView</button>
        </div>
      </section>

      <p id="statusMessage" class="status" role="status"></p>
      <p class="note">Changes apply only in this browser.</p>
    </main>

    <script src="namespace.js"></script>
    <script src="selectorRegistry.js"></script>
    <script src="sidebarBackgrounds.js"></script>
    <script src="presets.js"></script>
    <script src="storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
