<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CleanView</title>
    <link rel="icon" href="assets/icons/cleanview-mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="brand-lockup">
        <img class="brand-mark" src="assets/icons/cleanview-mark.svg" alt="CleanView">
        <div>
          <p class="eyebrow">CleanView</p>
          <h1>CleanView</h1>
        </div>
      </header>

      <label class="toggle-row popup-toggle-row">
        <span>CleanView</span>
        <span class="popup-toggle">
          <input id="enabledToggle" type="checkbox" aria-label="Enable CleanView">
          <span class="popup-toggle-slider" aria-hidden="true"></span>
        </span>
      </label>

      <section id="currentViewSummary" class="current-view-summary" hidden>
        <span>Current View</span>
        <strong id="currentViewName">No saved view</strong>
      </section>

      <label id="presetField" class="field" for="presetSelect">
        Switch View
        <select id="presetSelect"></select>
      </label>

      <section id="emptyStateMessage" class="empty-state" hidden>
        <p class="empty-state-title">No active view yet.</p>
        <p class="empty-state-copy">Create your first CleanView to simplify your GHL sidebar.</p>
      </section>

      <section class="popup-section" aria-label="Customize View">
        <div class="button-row">
          <button id="panelButton" type="button">Customize View</button>
        </div>
      </section>

      <p id="statusMessage" class="status" role="status"></p>
    </main>

    <script src="namespace.js"></script>
    <script src="selectorRegistry.js"></script>
    <script src="sidebarBackgrounds.js"></script>
    <script src="presets.js"></script>
    <script src="plans.js"></script>
    <script src="storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
