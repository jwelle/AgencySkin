<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgencySkin</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header>
        <p class="eyebrow">AgencySkin</p>
        <h1>CleanView</h1>
      </header>

      <label class="toggle-row">
        <span>CleanView</span>
        <input id="enabledToggle" type="checkbox">
      </label>

      <label class="field" for="presetSelect">
        Active Profile
        <select id="presetSelect"></select>
      </label>

      <section class="popup-section" aria-label="Manage">
        <p class="section-label">Manage</p>
        <div class="button-row">
          <button id="panelButton" type="button">Open CleanView Panel</button>
          <button id="applyButton" class="secondary" type="button">Apply to Current GHL Tab</button>
          <button id="advancedButton" class="secondary" type="button">Advanced Settings</button>
        </div>
      </section>

      <p id="statusMessage" class="status" role="status"></p>
      <p class="note">Changes apply only in this browser.</p>
    </main>

    <script src="namespace.js"></script>
    <script src="selectorRegistry.js"></script>
    <script src="sidebarBackgrounds.js"></script>
    <script src="presets.js"></script>
    <script src="storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
