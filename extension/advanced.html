<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CleanView - Advanced Settings</title>
    <link rel="stylesheet" href="editor.css">
  </head>
  <body>
    <main class="editor-shell advanced-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">CleanView</p>
          <h1>Advanced Settings</h1>
        </div>
        <p id="statusMessage" class="status" role="status"></p>
      </header>

      <section class="panel">
        <div class="panel-header">
          <div>
            <h2>Backup and Restore</h2>
            <p>Export, restore, or reset local CleanView data stored in this browser.</p>
          </div>
        </div>
        <label class="field" for="backupTextarea">
          CleanView Storage JSON
          <textarea id="backupTextarea" rows="14" spellcheck="false"></textarea>
        </label>
        <div class="button-row">
          <button id="exportButton" type="button">Export Backup</button>
          <button id="importButton" class="secondary" type="button">Restore Backup</button>
          <button id="resetButton" class="danger" type="button">Reset Data</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div>
            <h2>Diagnostics</h2>
            <p>Check whether an open GoHighLevel tab is reachable from CleanView.</p>
          </div>
        </div>
        <div class="button-row">
          <button id="detectButton" type="button">Detect GHL Sidebar</button>
        </div>
        <pre id="diagnosticsOutput" class="profile-transfer-preview" hidden></pre>
      </section>
    </main>

    <script src="namespace.js"></script>
    <script src="selectorRegistry.js"></script>
    <script src="sidebarBackgrounds.js"></script>
    <script src="presets.js"></script>
    <script src="plans.js"></script>
    <script src="storage.js"></script>
    <script src="advanced.js"></script>
  </body>
</html>
